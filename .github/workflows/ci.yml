name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: Test & build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests (real ConPTY, DPAPI, named pipes)
        run: npm test

      - name: Build app
        run: |
          npm run build:node
          npm run build:renderer

      - name: Package (unpacked app)
        run: npx electron-builder --win dir --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: OmniTerminal-win-unpacked
          path: release/win-unpacked
          retention-days: 7
